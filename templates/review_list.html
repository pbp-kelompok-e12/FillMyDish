{% extends 'base.html' %}

{% block content %}


<div class="review-page review-page--list">
    <header class="review-header">
        <h1 class="review-title">What's on Their Plate?</h1>
        <p class="review-subtitle">See what our community has to say!</p>
    </header>

    <section class="review-body">
        <button type="button" class="review-add" id="add-btn">Add Yours</button>
        <div class="review-list" id="review-list"></div>
    </section>
</div>


<div class="review-modal" id="modal">
    <form class="review-form" id="review-form">
        {% csrf_token %}
        <h2 class="review-form__title">Add Yours</h2>

        <div class="review-form__field">
            <label for="{{ form.message.id_for_label }}">Message</label>
            {{ form.message }}
            <p class="review-form__error" id="form-error"></p>
        </div>

        <div class="review-form__actions">
            <button type="button" class="review-form__cancel" id="cancel-btn">Cancel</button>
            <button type="submit" class="review-form__submit">Submit</button>
        </div>
    </form>
</div>

<div id="django-messages" hidden>
    {% for message in messages %}
        <span
            class="django-message"
            data-level="{{ message.tags }}"
        >
            {{ message }}
        </span>
    {% endfor %}
</div>


<div
    id="review-config"
    hidden
    data-logged-in="{{ user.is_authenticated|yesno:'true,false' }}"
    data-login-url="{{ login_url }}"
    data-update-url="{% url 'review:update' 0 %}"
    data-delete-url="{% url 'review:delete' 0 %}"
></div>

<script>
    const list = document.getElementById('review-list');
    const modal = document.getElementById('modal');
    const form = document.getElementById('review-form');
    const textarea = form.querySelector('textarea');
    const errorEl = document.getElementById('form-error');
    const csrf = form.querySelector('[name=csrfmiddlewaretoken]').value;

    
    const config = document.getElementById("review-config");

    const isLoggedIn = config.dataset.loggedIn === "true";

    const loginUrl = config.dataset.loginUrl;

    const updateUrl = (id) =>
        config.dataset.updateUrl.replace("/0/", `/${id}/`);

    const deleteUrl = (id) =>
        config.dataset.deleteUrl.replace("/0/", `/${id}/`);


    function showToast(text, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'review-toast' + (isError ? ' review-toast--error' : '');
        toast.textContent = text;
        document.body.append(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // textContent (bukan innerHTML) supaya aman dari XSS
    function makeCard(review) {
        const card = document.createElement('article');
        card.className = 'review-card';

        const name = document.createElement('h3');
        name.className = 'review-card__name';
        name.textContent = review.fields.user;

        const message = document.createElement('p');
        message.className = 'review-card__message';
        message.textContent = review.fields.message;

        card.append(name, message);

        if (review.fields.is_owner) {
            const actions = document.createElement('div');
            actions.className = 'review-card__actions';

            // Edit: link ke halaman update
            const editLink = document.createElement('a');
            editLink.href = updateUrl(review.pk);
            editLink.textContent = 'Edit';

            // Delete: form POST biasa (redirect), sama seperti di portofolio
            const deleteForm = document.createElement('form');
            deleteForm.method = 'post';
            deleteForm.action = deleteUrl(review.pk);

            const token = document.createElement('input');
            token.type = 'hidden';
            token.name = 'csrfmiddlewaretoken';
            token.value = csrf;

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'submit';
            deleteBtn.textContent = 'Delete';

            deleteForm.append(token, deleteBtn);
            deleteForm.addEventListener('submit', (e) => {
                if (!confirm('Hapus review ini?')) e.preventDefault();
            });

            actions.append(editLink, deleteForm);
            card.append(actions);
        }
        return card;
    }

    async function loadReviews() {
        const res = await fetch("{% url 'review:json' %}");
        const reviews = await res.json();

        list.replaceChildren();
        if (reviews.length === 0) {
            const empty = document.createElement('article');
            empty.className = 'review-card';
            empty.textContent = 'Belum ada review. Jadilah yang pertama!';
            list.append(empty);
            return;
        }
        reviews.forEach((r) => list.append(makeCard(r)));
    }

    function openModal() {
        textarea.value = '';
        errorEl.style.display = 'none';
        modal.classList.add('is-open');
        textarea.focus();
    }

    function closeModal() {
        modal.classList.remove('is-open');
    }

    document.getElementById('add-btn').onclick = () => {
        if (!isLoggedIn) {
            window.location.href = loginUrl;
            return;
        }
        openModal();
    };

    document.getElementById('cancel-btn').onclick = closeModal;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch("{% url 'review:create_ajax' %}", {
            method: 'POST',
            body: new FormData(form),
        });
        const data = await res.json().catch(() => ({}));

        if (res.status === 401) {
            window.location.href = loginUrl;
        } else if (res.ok) {
            closeModal();
            showToast(data.message);
            loadReviews();
        } else if (data.errors) {
       
            errorEl.textContent = Object.values(data.errors).flat().map((e) => e.message).join(' ');
            errorEl.style.display = 'block';
        } else {
            showToast('Terjadi kesalahan. Coba lagi.', true);
        }
    });

    document.querySelectorAll(".django-message").forEach((item) => {
    const message = item.textContent.trim();
    const isError = item.dataset.level.split(" ").includes("error");

    showToast(message, isError);
    });

    loadReviews();
</script>
{% endblock content %}
