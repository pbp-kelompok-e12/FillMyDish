{% extends 'base.html' %}

{% block content %}

<div class="review-page review-page--form">
    <form class="review-form" method="post">
        {% csrf_token %}

        <h1 class="review-form__title">
            {% if form.instance.pk %}Edit Yours{% else %}Add Yours{% endif %}
        </h1>

        <div class="review-form__field">
            <label for="{{ form.message.id_for_label }}">Message</label>
            {{ form.message }}
            {% for error in form.message.errors %}
            <p class="review-form__error">{{ error }}</p>
            {% endfor %}
        </div>

        <div class="review-form__actions">
            <a class="review-form__cancel" href="{% url 'review:list' %}">Cancel</a>
            <button class="review-form__submit" type="submit">Submit</button>
        </div>
    </form>
</div>
{% endblock content %}
