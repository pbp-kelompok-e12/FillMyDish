{% for log in logs %}
    <article class="review-card">
        <span class="review-card__status review-card__status--{{ log.status }}">
            {{ log.get_status_display }}
        </span>
        <h3 class="review-card__name">{{ log.user.username }}</h3>
        {% for argument in log.arguments %}
        <p class="review-card__message">{{ argument }}</p>
        {% endfor %}
        <div class="review-card__actions">
            <a href="{% url 'moderation:review' log.pk %}"
            hx-get="{% url 'moderation:review' log.pk %}"
            hx-target="#modal"
            hx-swap="innerHTML"
            hx-on::after-request="document.getElementById('modal').classList.add('is-open')">Review</a>
        </div>
    </article>
{% empty %}
    <article class="review-card">No suspicious requests yet</article>
{% endfor %}
