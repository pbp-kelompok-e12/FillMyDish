{% extends 'base.html' %}
{% load static %}

{% block content %}
    <main class="mealplan-page">
        <header class="mealplan-header">
            <h1 class="mealplan-title">Edit Your Meal Plan</h1>
        </header>

        <form
            class="mealplan-create-form"
            method="post"
            action="{% url 'mealplan:update_mealplan' plan.id %}"
        >
            {% csrf_token %}

            {% if error %}
                <p role="alert">{{ error }}</p>
            {% endif %}

            <h2 class="mealplan-form-title">Plan Title and Description</h2>

            <div class="field-group">
                <label class="field-label" for="plan-title">Title</label>
                <input
                    class="field-input"
                    id="plan-title"
                    name="title"
                    type="text"
                    maxlength="255"
                    value="{{ title|default:plan.title }}"
                    required
                >
            </div>

            <div class="field-group">
                <label class="field-label" for="plan-description">
                    Description <span>(optional)</span>
                </label>
                <textarea
                    class="field-input plan-description-input"
                    id="plan-description"
                    name="description"
                >{{ description|default:plan.description }}</textarea>
            </div>

            <div class="mealplan-form-actions">
                <a
                    class="mealplan-cancel-link"
                    href="{% url 'mealplan:mealplan_detail' plan.id %}"
                >
                    Cancel
                </a>
                <a
                    class="mealplan-cancel-link"
                    href="{% url 'mealplan:edit_mealplan_recipes' plan.id %}"
                >
                    Skip
                </a>
                <button class="search-btn mealplan-submit-btn" type="submit">
                    Save Changes
                </button>
            </div>
        </form>
    </main>
{% endblock %}
